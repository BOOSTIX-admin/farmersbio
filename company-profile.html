<style>
:root{
  --paper:#FFFFFF; --parchment:#F5F2EB; --ink:#1C1A16; --muted:#6E6A60; --muted-2:#948F82;
  --dark:#14162C; --red:#E60012; --line:#E4DFD3;
  --sans:"Pretendard","Pretendard Variable",system-ui,-apple-system,sans-serif;
  --bar:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--parchment);line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
a:focus-visible,button:focus-visible{outline:3px solid #E8F07C;outline-offset:3px}

/* ── 상단 바 ─────────────────────────────────────────── */
.vbar{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--bar);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  padding:0 22px;background:rgba(20,22,44,.94);backdrop-filter:blur(12px);color:#fff}
.vbar .vleft{display:flex;align-items:center;gap:14px;min-width:0}
.vbar .vlogo img{height:16px;width:auto;opacity:.95}
.vbar .vtitle{display:flex;align-items:baseline;gap:9px;white-space:nowrap;overflow:hidden}
.vbar .vtitle b{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.vbar .vtitle span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.vcount{justify-self:center;font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums}
.vcount b{color:#fff;font-weight:600}
.vright{justify-self:end;display:flex;align-items:center;gap:9px}
.vdl{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:10px 18px;border-radius:2px;background:var(--red);color:#fff;transition:.22s;white-space:nowrap}
.vdl:hover{background:#fff;color:var(--dark)}
.vdl svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vhome{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid rgba(255,255,255,.28);border-radius:2px;transition:.22s}
.vhome:hover{background:#fff;color:var(--dark);border-color:#fff}
.vhome svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 문서 ────────────────────────────────────────────── */
.vdoc{max-width:1180px;margin:0 auto;padding:calc(var(--bar) + 34px) 22px 0}
.vpage{position:relative;margin-bottom:20px;background:#fff;border-radius:3px;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,22,44,.06),0 10px 30px rgba(20,22,44,.08)}
.vpage img{width:100%;height:auto;aspect-ratio:16/9;background:#faf9f6}
.vpage::after{content:attr(data-n);position:absolute;right:12px;bottom:10px;
  font-size:10.5px;letter-spacing:.12em;color:var(--muted-2);opacity:0;transition:.2s;
  background:rgba(255,255,255,.9);padding:3px 8px;border-radius:2px}
.vpage:hover::after{opacity:1}

/* ── 하단 CTA ────────────────────────────────────────── */
.vend{margin:56px auto 0;max-width:1180px;padding:0 22px 90px}
.vend-in{background:var(--dark);color:#fff;border-radius:3px;padding:54px 48px;
  display:flex;align-items:center;justify-content:space-between;gap:34px;flex-wrap:wrap}
.vend h2{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.vend p{margin-top:10px;font-size:14px;color:rgba(255,255,255,.62)}
.vend-act{display:flex;gap:11px;flex-wrap:wrap}
.vbtn{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  padding:16px 30px;border-radius:2px;transition:.22s;white-space:nowrap}
.vbtn.pri{background:var(--red);color:#fff}
.vbtn.pri:hover{background:#fff;color:var(--dark)}
.vbtn.sec{border:1px solid rgba(255,255,255,.34);color:#fff}
.vbtn.sec:hover{background:#fff;color:var(--dark);border-color:#fff}
.vbtn svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vmeta{margin-top:18px;text-align:right;font-size:11.5px;color:var(--muted-2);letter-spacing:.04em}

/* ── 반응형 ──────────────────────────────────────────── */
@media(max-width:860px){
  :root{--bar:56px}
  .vbar{grid-template-columns:1fr auto;padding:0 14px;gap:10px}
  .vcount{display:none}
  .vbar .vtitle span{display:none}
  .vhome{display:none}
  .vdl{padding:9px 14px;font-size:11px}
  .vdoc{padding:calc(var(--bar) + 20px) 14px 0}
  .vpage{margin-bottom:13px}
  .vend{padding:0 14px 64px;margin-top:38px}
  .vend-in{padding:38px 26px;flex-direction:column;align-items:flex-start;gap:26px}
  .vend h2{font-size:21px}
  .vbtn{padding:15px 24px}
  .vmeta{text-align:left}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

<script>
(function(){
  var now = document.getElementById('vnow');
  var pages = document.querySelectorAll('.vpage');
  if(!now || !pages.length || !('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting) now.textContent = e.target.dataset.n.replace(/^0/,'');
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  pages.forEach(function(p){ io.observe(p); });
})();
</script>
